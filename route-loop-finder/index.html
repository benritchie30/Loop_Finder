<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232f6fe4'/%3E%3Cpath d='M16 23.5c-5 0-8.5-3-8.5-7s3.4-7 7.6-7c3.5 0 6.1 2.300 6.100 5.300 0 2.700-2.100 4.700-4.800 4.700' fill='none' stroke='%23fff' stroke-width='2.600' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='23.500' r='2.600' fill='%23fff'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fb" />
    <title>Loop Finder</title>
    <script>
      // The saved appearance, before the first paint (src/utils/theme.js keeps it current).
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('theme');
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = saved === 'dark' || saved === 'light' ? saved : dark ? 'dark' : 'light';
          var hue = Number(localStorage.getItem('primaryColor'));
          if (isFinite(hue) && localStorage.getItem('primaryColor') !== null) {
            document.documentElement.style.setProperty('--hue', String(hue));
            document.documentElement.style.setProperty('--fav-hue', String((hue + 180) % 360));
          }
        } catch (e) { /* defaults */ }
        document.documentElement.dataset.theme = theme;
        var style = 'classic';
        try { if (localStorage.getItem('uiStyle') === 'modern') style = 'modern'; } catch (e) { /* default */ }
        document.documentElement.dataset.style = style;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
